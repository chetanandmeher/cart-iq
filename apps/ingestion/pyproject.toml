[tool.poetry]
name = "ingestion"
version = "0.1.0"
description = ""
package-mode = false
authors = ["Chetanand Meher <chetanandmeher1282004@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = ">=0.136.1,<0.137.0"
uvicorn = ">=0.46.0,<0.47.0"
kafka-python = ">=2.3.1,<3.0.0"
pydantic-settings = ">=2.14.1,<3.0.0"
common = { path = "../../libs/common", develop = true }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
